<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reza Adisanyoto</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 700px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #30363d;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      color: #f0f6fc;
      margin-bottom: 0.5rem;
    }

    .username {
      font-size: 1rem;
      color: #8b949e;
      margin-bottom: 1.5rem;
    }

    .bio {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #c9d1d9;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .links a {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      background: #21262d;
      color: #c9d1d9;
      text-decoration: none;
      border-radius: 6px;
      border: 1px solid #30363d;
      font-size: 0.95rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .links a:hover {
      background: #30363d;
      border-color: #8b949e;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: #484f58;
    }
  </style>
</head>
<body>
  <div class="container">
    <img
      class="avatar"
      src="https://avatars.githubusercontent.com/u/191742960?v=4"
      alt="Reza Adisanyoto"
    />
    <h1>Reza Adisanyoto</h1>
    <p class="username">@RezaAdisanyoto</p>
    <p class="bio">Selamat datang di website saya! 👋</p>
    <div class="links">
      <a href="https://github.com/RezaAdisanyoto" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
  <footer>
    &copy; 2026 Reza Adisanyoto &mdash; referfbby.me
  </footer>
</body>
</html>
